name: Reborn CI - Full-Stack Verification & Pipeline Quality Gate

on:
  push:
    branches:
      - development
      - release
      - production
  pull_request:
    branches:
      - development
      - release
      - production

jobs:
  backend-test:
    name: Backend API & Computational Engine Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Seed Generator & Computational Service
        working-directory: ./backend
        run: node src/utils/seedData.js

      - name: Verify Backend Server Boot (Smoke Test)
        working-directory: ./backend
        env:
          PORT: 5000
          NODE_ENV: test
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 4
          kill $SERVER_PID || true

  frontend-build:
    name: Frontend React + Three.js + GSAP Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Assets (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Verify Production Bundle Artifacts
        run: |
          test -f frontend/dist/index.html
          echo "Frontend build successfully generated index.html and assets."

  docker-verification:
    name: Docker Multi-Container Compose Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Configuration & Build Images
        run: |
          docker compose config
          docker compose build --parallel
