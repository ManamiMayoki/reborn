services:
  # MongoDB Database Service
  mongo:
    image: mongo:7-jammy
    container_name: reborn-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=reborn
    volumes:
      - mongo_data:/data/db
    networks:
      - reborn-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reborn-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/reborn
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - reborn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # React + Three.js + GSAP Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reborn-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reborn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  reborn-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
